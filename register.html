<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | NextPage></title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/auth.css" />
  </head>
  <body>
    <div id="login" class="container">
      <div class="card">
        <h1 class="txt-color">Register</h1>
        <form class="form" action="">
          <label for="username" class="txt-color">Username </label>
          <input id="username" class="input" type="text" required />
          <label for="email" class="txt-color">Email </label>
          <input id="email" class="input" type="text" required />
          <label for="password" class="txt-color">Password </label>
          <input id="password" class="input" type="text" required />
          <br />
          <button class="btn btn-outline-light">Register</button>
          <p class="txt-sec-color">
            Already have an account? <a href="./login.html">Login</a>
          </p>
        </form>
      </div>
    </div>

    <script src="./scripts/register.js"></script>
  </body>
</html>
